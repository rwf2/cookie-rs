[package]
name = "cookie"
version = "0.19.0-rc.0"
authors = ["Sergio Benitez <sb@sergio.bz>", "Alex Crichton <alex@alexcrichton.com>"]
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rwf2/cookie-rs"
readme = "README.md"
include = ["/src", "/README*", "/CHANGELOG*", "/LICENSE*"]
description = """
HTTP cookie parsing and cookie jar management. Supports signed and private
(encrypted, authenticated) jars.
"""

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly)'] }

[features]
default = ["percent-encode"]
percent-encode = ["dep:percent-encoding"]
secure = ["private", "signed", "key-expansion"]
private = ["dep:aes-gcm", "dep:base64", "dep:rand", "dep:subtle", "dep:ctutils", "dep:cmov"]
signed = ["dep:hmac", "dep:sha2", "dep:base64", "dep:rand", "dep:subtle", "dep:ctutils", "dep:cmov"]
key-expansion = ["dep:sha2", "dep:hkdf", "dep:ctutils", "dep:cmov"]

[dependencies]
percent-encoding = { version = "2.0", optional = true }

# dependencies for secure (private/signed) functionality
aes-gcm = { version = "0.11", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
base64 = { version = "0.23", optional = true }
rand = { version = "0.10.1", default-features = false, features = ["sys_rng"], optional = true }
hkdf = { version = "0.13", optional = true }
subtle = { version = "2.3", optional = true }

# unused directly: sets minimum versions of dependencies with security fixes
ctutils = { version = "0.4.4", optional = true }
cmov = { version = "0.5.4", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "nightly"]
